[package]
name = "cool-buddy-tauri"
version = "1.0.6"
description = "Cool Buddy desktop app powered by Tauri"
authors = ["ten.x"]
edition = "2021"

[lib]
name = "cool_buddy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
